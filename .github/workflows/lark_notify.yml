name: Lark PDF Update Notification
on:
  push:
    paths:
      - 'The_World_in_Brief.pdf'  # 监控这个 PDF 文件的变动

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark Card
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "☕️ 经济学人简报已更新",
                  "content": [
                    [{
                      "tag": "text",
                      "text": "作者已推送最新的 The World in Brief PDF。"
                    }],
                    [{
                      "tag": "text",
                      "text": "您可以直接点击下方链接在手机上阅读或下载："
                    }],
                    [{
                      "tag": "a",
                      "text": "📑 立即点击下载 PDF",
                      "href": "https://github.com{{ github.repository }}/raw/main/The_World_in_Brief.pdf"
                    }]
                  ]
                }
              }
            }
          }' \
          ${{ secrets.LARK_WEBHOOK }}
